name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - name: linux-amd64
            runs_on: ubuntu-24.04
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm

          # macOS
          - name: macos-arm64
            runs_on: macos-15
          - name: macos-amd64
            runs_on: macos-15-intel

          # Windows
          - name: windows-amd64
            runs_on: windows-latest
          - name: windows-arm64
            runs_on: windows-11-arm

    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23

      - name: Generate Wails build assets
        shell: bash
        run: |
          wails3 update build-assets -name "elabftw-desktop" -binaryname "elabftw-desktop" -config build/config.yml -dir build

      - name: Build (Wails)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            wails3 task package PRODUCTION=true
          else
            wails3 task build PRODUCTION=true
          fi

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          case '${{ runner.os }}' in
            Linux)
              cp build/bin/elabftw-desktop 'release/elabftw-desktop-${{ matrix.name }}'
              ;;
            Windows)
              cp build/bin/elabftw-desktop.exe 'release/elabftw-desktop-${{ matrix.name }}.exe'
              ;;
            macOS)
              ditto -c -k --sequesterRsrc --keepParent build/bin/elabftw-desktop.app 'release/elabftw-desktop-${{ matrix.name }}.zip'
              ;;
          esac

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: build/bin/**
          if-no-files-found: error

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" release/* --clobber --repo "$REPOSITORY"
